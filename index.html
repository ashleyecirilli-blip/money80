<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Money 80 · My Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, steady, grown-up. A practice, not a scoreboard.
   IDEA: a framed watercolor — her private context lives in the painted frame, her practice on the paper inside.
   PICTURE: three glass vessels whose water physically rises, ripples on real follow-through, and keeps a high-water mark.
   COLOUR and TYPE: TealSpin teal, fuchsia, purple bleeding into one another; Georgia for her words, DM Sans for the tools.
   LAYOUT: frame → welcome → one next step → the flow → momentum, people, for you. Phones: frame becomes a top band + bottom tabs. */
:root{color-scheme:light dark;
--paper:light-dark(#ffffff,#1b1128);--paper2:light-dark(#f7f2fb,#251937);--ink:light-dark(#24152f,#f4edf9);--mute:light-dark(#6a5a78,#bba9cc);--line:light-dark(#e8dff0,#3b2a4f);
--teal:#0A949C;--turq:#2CC6C9;--fuch:#DA0C9B;--purp:#6A1B9A;
--d1:#36cfd1;--d2:#07727a;--k1:#a65ad6;--k2:#561483;--f1:#f24aa9;--f2:#9c0a72;
--pb:#4d1272;--p1:#0A949C;--p2:#2CC6C9;--p3:#DA0C9B;--p4:#6A1B9A;--p5:#9a1fa8;--p6:#b4128f;--p7:#0b6f8a;
--tealink:light-dark(#07727a,#62dde2);--fuchink:light-dark(#ad0879,#ff72c9);--purpink:light-dark(#5a1688,#cfa2f5);
--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--sans:"DM Sans",system-ui,-apple-system,sans-serif}
:root[data-palette=sunrise]{--teal:#C9482F;--turq:#F39A5B;--fuch:#D81B60;--purp:#5E2A84;--d1:#ff9a7a;--d2:#b73b25;--k1:#b16be0;--k2:#5a1a8a;--f1:#f2508f;--f2:#a3104a;--pb:#6a1846;--p1:#E8604C;--p2:#F7A25B;--p3:#D81B60;--p4:#5E2A84;--p5:#a8296b;--p6:#f07a5a;--p7:#8a2a6e}
:root[data-palette=lagoon]{--teal:#0A7F8A;--turq:#38B6E8;--fuch:#7B4BC4;--purp:#1E3F8A;--d1:#3fd4cf;--d2:#08707a;--k1:#5aaef2;--k2:#1b4c99;--f1:#a083f2;--f2:#5a32b0;--pb:#14306e;--p1:#0A949C;--p2:#38B6E8;--p3:#7B4BC4;--p4:#1E3F8A;--p5:#2a6fc0;--p6:#5d58d0;--p7:#0b6f8a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;color:var(--ink);font:16px/1.55 var(--sans);background:#4a1470;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,4vw,46px)}h2{font-size:clamp(26px,3vw,34px)}h3{font-size:20px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fuch);outline-offset:2px;border-radius:8px}
.paint{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.frame{padding:14px clamp(10px,1.6vw,22px) 22px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:16px;color:#fff;padding:2px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;background:none;border:0;padding:0}
.brand b{font:400 26px/1 var(--serif);letter-spacing:.2px}
.nav{display:flex;gap:4px;margin-inline:auto;flex-wrap:wrap}
.nav button{background:none;border:0;color:#fff;padding:10px 14px;border-radius:999px;font-weight:500;min-height:44px;opacity:.86}
.nav button:hover{background:rgba(255,255,255,.14);opacity:1}
.nav button[aria-current=page]{background:#fff;color:var(--purp);opacity:1}
.nav .s{display:none}
.topr{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 14px;min-height:44px;font-weight:500}
.pill[aria-pressed=true]{background:#fff;color:var(--purp)}
.palw{position:relative}.dotp{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--turq),var(--purp),var(--fuch),var(--turq));border:2px solid #fff}
.palpop{position:absolute;right:0;top:54px;z-index:75;background:var(--paper);color:var(--ink);border-radius:18px;padding:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);display:none;width:max-content}
.palpop.open{display:block}.palpop .sw2{border-color:var(--line)}.palpop .sw2[aria-pressed=true]{border-color:var(--ink)}.palpop b{display:block;font:500 14px var(--sans);margin-bottom:8px}
.body{display:grid;grid-template-columns:272px minmax(0,1fr);gap:16px;flex:1}
.ctx{color:#fff;display:flex;flex-direction:column;gap:14px;padding:6px 4px}
.glass{background:rgba(28,8,44,.32);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:16px}
.ctx h4{margin:0 0 8px;font:500 14px/1.3 var(--sans);opacity:.85}
.ctx .who{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:400 22px var(--serif);background:radial-gradient(circle at 30% 30%,var(--turq),var(--purp) 70%);color:#fff;border:2px solid rgba(255,255,255,.7);flex:none}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 11px;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.28);position:relative;flex:none;cursor:pointer;transition:.2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked{background:var(--fuch)}.sw:checked::after{left:21px}
.ctx select{width:100%;background:rgba(255,255,255,.95);color:#2a1638;border:0;border-radius:12px;padding:10px;min-height:44px}
.canvas{background:var(--paper);border-radius:30px;padding:clamp(20px,3.2vw,44px);box-shadow:0 30px 80px -30px rgba(20,0,40,.55);position:relative;overflow:hidden;min-height:70vh}
.canvas::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--teal),var(--purp),var(--fuch))}
.lede{color:var(--mute);font-size:17px;max-width:62ch;margin-top:8px}
.eyebrow{font-weight:500;color:var(--tealink);font-size:15px;margin-bottom:6px}
.serif{font-family:var(--serif)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;min-height:46px;font-weight:700;background:var(--purp);color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(106,27,154,.6)}
.btn.f{background:var(--fuch)}.btn.t{background:var(--teal)}
.btn.w{background:#fff;color:var(--purp)}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;padding:6px 0;color:var(--purpink);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.card{background:var(--paper2);border-radius:22px;padding:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sec{margin-top:34px}
.sech{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:14px}
/* next step */
.next{margin-top:24px;border-radius:26px;padding:clamp(22px,3vw,34px);color:#fff;background:radial-gradient(120% 140% at 0% 0%,var(--teal) 0%,transparent 55%),radial-gradient(120% 140% at 100% 100%,var(--fuch) 0%,transparent 55%),var(--purp);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.next h2{font-size:clamp(26px,3vw,36px)}
.next p{opacity:.92;margin-top:8px;max-width:58ch}
.next .acts{display:flex;gap:10px;flex-wrap:wrap}
.next .also{margin-top:14px;font-size:15px;background:rgba(255,255,255,.14);display:inline-block;padding:8px 14px;border-radius:14px}
.next .also button{background:none;border:0;color:#fff;font-weight:700;text-decoration:underline;padding:0}
.intro{margin-top:22px;border:1.5px dashed var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:18px;align-items:start}
.intro b{font-family:var(--serif);font-weight:400;font-size:20px;display:block}
.intro .when{color:var(--tealink);font-weight:700;font-size:14px}
/* vessels */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vw,30px)}
.vessel{display:flex;flex-direction:column;gap:12px}
.jar{position:relative;height:260px;border-radius:28px 28px 40px 40px;background:linear-gradient(180deg,var(--paper2),var(--paper));border:2px solid var(--line);overflow:hidden;isolation:isolate}
.big .jar{height:320px}
.jar .mk{position:absolute;left:0;right:0;border-top:1.5px dashed light-dark(rgba(60,30,80,.16),rgba(255,255,255,.16));z-index:2}
.hwm{position:absolute;left:0;right:0;border-top:2px dotted var(--ink);opacity:.55;z-index:3}
.hwm span{position:absolute;right:8px;top:-26px;font-size:13px;background:var(--paper);padding:1px 8px;border-radius:99px;white-space:nowrap}
.water{position:absolute;left:0;right:0;bottom:0;transition:height 1.6s cubic-bezier(.25,.8,.25,1);z-index:1}
.wave{position:absolute;left:0;top:-15px;width:200%;height:18px;animation:drift 7s linear infinite}
.wave.b{opacity:.5;animation-duration:11s;animation-direction:reverse;top:-11px}
@keyframes drift{to{transform:translateX(-50%)}}
.surge .wave{animation-duration:1.6s}
.surge .wave.a{animation:drift 1.6s linear infinite,swell 1.8s ease-out}
@keyframes swell{30%{transform:translateX(-12%) scaleY(2.1)}}
.ring{position:absolute;left:50%;width:30px;height:10px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);animation:ring 1.6s ease-out forwards;z-index:4;pointer-events:none}
@keyframes ring{to{width:240px;height:40px;opacity:0}}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.2) 60%);animation:rise 2.4s ease-in forwards;z-index:4;pointer-events:none}
@keyframes rise{to{transform:translateY(-260px);opacity:0}}
.v-debt{--c1:var(--d1);--c2:var(--d2)}.v-cushion{--c1:var(--k1);--c2:var(--k2)}.v-future{--c1:var(--f1);--c2:var(--f2)}
.water{background:linear-gradient(180deg,var(--c1),var(--c2))}.wave path{fill:var(--c1)}
.vm small{color:var(--mute);font-size:14px}
.vm h3{margin:2px 0 6px}
.vm .pc{font:400 30px/1 var(--serif)}
.vm .gl{font-size:14px;color:var(--mute);margin-top:4px}
.vm .acts{display:flex;gap:4px 14px;flex-wrap:wrap}
.solid{position:absolute;inset:auto 12px 14px;color:#fff;font-size:14px;text-align:center;z-index:5}
/* momentum / people / foryou */
.mo li{list-style:none;display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mo ul{padding:0;margin:0}
.mo li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--teal)}
.mo li.k-checkin::before{background:var(--purp)}.mo li.k-mile::before{background:var(--fuch)}.mo li.k-learn::before{background:var(--turq)}
.mo time{display:block;font-size:13px;color:var(--mute)}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.counts span{background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px}
.ppl blockquote{margin:0 0 12px;font:400 17px/1.4 var(--serif)}
.ppl cite{display:block;font:500 14px var(--sans);color:var(--mute);margin-top:4px;font-style:normal}
.fy .tag{font-size:13px;font-weight:700;color:var(--fuchink)}
.later{margin-top:16px;display:grid;gap:8px}
.later div{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--paper2);border-radius:14px;padding:8px 8px 8px 16px;flex-wrap:wrap}
/* flows */
.flowhead{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.steps{display:flex;gap:6px;flex:1;max-width:520px}
.steps i{flex:1;height:8px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.steps i.on{background:linear-gradient(90deg,var(--teal),var(--purp))}
.panel{max-width:720px}
.f{display:grid;gap:6px;margin-top:18px}
.f>label,.lab{font-weight:700;font-size:15px}
.cur{display:flex;align-items:center;background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;min-height:50px;max-width:260px}
.cur:focus-within{border-color:var(--purp)}
.cur span{color:var(--mute);font-weight:700}
.cur input,.txt{border:0;background:none;padding:12px 6px;font-size:17px;width:100%;outline:none}
.txt,textarea,select.in{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;width:100%}
textarea{min-height:96px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;min-height:44px;font-weight:500}
.chip[aria-pressed=true]{background:var(--purp);border-color:var(--purp);color:#fff}
.chip.sm{min-height:36px;padding:5px 12px;font-size:14px}
.tip{margin-top:18px;border-radius:18px;padding:14px 16px;background:light-dark(#e9f8f8,#0d3337);display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;font-size:15px}
.tip svg{width:22px;height:22px;color:var(--tealink);margin-top:1px}
.tip b{color:var(--tealink)}
details.opt{margin-top:16px;border-radius:16px;background:var(--paper2);padding:4px 16px}
details.opt summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--purpink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;padding-bottom:14px}
.bill{display:grid;grid-template-columns:auto minmax(0,1fr) 180px auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.bill input[type=checkbox],.ck input{width:22px;height:22px;accent-color:var(--purp)}
.bill .cur{min-height:44px}
.x{background:none;border:0;color:var(--mute);width:40px;height:40px;border-radius:50%;font-size:20px}
.x:hover{background:var(--paper2)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:28px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}
.total{font:400 28px/1 var(--serif)}
.eq{display:grid;grid-template-columns:repeat(4,auto);gap:10px 18px;align-items:end;justify-content:start;margin-top:22px}
.eq div small{display:block;color:var(--mute);font-size:14px}
.eq div b{font:400 26px var(--serif)}
.avail{font:400 clamp(48px,7vw,76px)/1 var(--serif);color:var(--purpink);margin-top:18px}
.gp{display:grid;grid-template-columns:14px minmax(0,1fr) 200px;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.gp .dot{width:14px;height:14px;border-radius:50%;margin-top:6px;background:linear-gradient(var(--c1),var(--c2))}
.gp .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.move{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--paper2);margin-top:10px;transition:background .3s}
.move .st{width:34px;height:34px;border-radius:50%;border:2px dashed var(--mute);display:grid;place-items:center}
.move.s-done{background:light-dark(#e8f8f3,#0f3330)}
.move.s-done .st{border:0;background:var(--teal);color:#fff}
.move.s-later{opacity:.75}
.move.s-later .st{border-style:solid;border-color:var(--purp)}
.move small{display:block;color:var(--mute);font-size:14px}
.move .mb{display:flex;gap:6px}
.big-msg{text-align:center;max-width:620px;margin:20px auto}
.big-msg h1{font-size:clamp(34px,5vw,52px)}
.celebwave{height:150px;position:relative;overflow:hidden;border-radius:24px;margin:10px auto 26px;max-width:520px;background:var(--paper2)}
.celebwave .water{height:55%}
/* check-in */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.mode{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:24px;padding:22px;display:grid;gap:6px}
.mode:hover{border-color:var(--purp)}
.mode b{font:400 24px var(--serif)}
.mode .t{color:var(--tealink);font-weight:700;font-size:14px}
.conf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px;max-width:520px}
.conf button{border:1.5px solid var(--line);background:var(--paper);border-radius:18px;height:92px;position:relative;overflow:hidden;font:400 24px var(--serif)}
.conf button i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--turq),var(--teal));opacity:.25;transition:.3s}
.conf button span{position:relative}
.conf button[aria-pressed=true]{border-color:var(--teal)}
.conf button[aria-pressed=true] i{opacity:.9}
.conf button[aria-pressed=true] span{color:#fff}
.scale{display:flex;justify-content:space-between;max-width:520px;color:var(--mute);font-size:14px;margin-top:6px}
input[type=range]{width:100%;max-width:520px;accent-color:var(--fuch);height:30px}
.ck{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lb{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin-top:10px}
.bars{display:flex;gap:10px;align-items:end;height:130px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:end}
.bars i{width:100%;max-width:38px;border-radius:12px 12px 6px 6px;background:linear-gradient(var(--turq),var(--purp))}
.bars small{font-size:13px;color:var(--mute)}
.priv{display:flex;gap:12px;align-items:center;margin-top:18px;background:var(--paper2);border-radius:16px;padding:12px 16px}
.priv .sw{background:var(--line)}
.priv .sw:checked{background:var(--fuch)}
.theme-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
/* goals view */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.gc{border-radius:22px;padding:20px;background:var(--paper2);display:grid;gap:8px;border-top:6px solid var(--c2)}
.gc .amt{font:400 24px var(--serif)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:9px}
.marks{display:flex;gap:10px;flex-wrap:wrap}
.marks span{border-radius:999px;padding:6px 14px;font-size:14px;background:var(--paper2);border:1.5px solid var(--line)}
.marks span b{color:var(--fuchink)}
/* community */
.spaces{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
.guard{background:light-dark(#fdf0f8,#3a1030);border-radius:16px;padding:12px 16px;margin-top:12px;font-size:15px}
.compose{background:var(--paper2);border-radius:22px;padding:18px;margin-top:18px}
.compose textarea{background:var(--paper)}
.post{padding:20px 0;border-bottom:1px solid var(--line)}
.post header{display:flex;gap:12px;align-items:center}
.post .av{width:40px;height:40px;font-size:17px}
.post p.tx{font:400 19px/1.45 var(--serif);margin:12px 0}
.reacts{display:flex;gap:8px;flex-wrap:wrap}
.rb{border:0;border-radius:999px;padding:7px 14px;min-height:40px;background:light-dark(#fbe6f4,#43123a);color:var(--fuchink);font-weight:700;font-size:14px;position:relative}
.rb[aria-pressed=true]{background:var(--fuch);color:#fff}
.cmts{margin:12px 0 0 52px;display:grid;gap:10px}
.cmt{background:var(--paper2);border-radius:16px;padding:10px 14px;font-size:15px}

{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DAY=864e5, NOW=new Date();
const ago=n=>new Date(NOW-n*DAY).toISOString();
const fdate=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const wdate=d=>new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(x)?x:0};
const money=n=>'$'+Math.round(n).toLocaleString('en-US');

 check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
 bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>'
};

const LAYERS=[
 {id:'debt',sub:'Debt',title:'Find your footing'},

 {id:'encourage',t:'Encouragement',d:'Cheer me on when I show up.'},

 {id:'reflect',n:'Reflect',q:'How intentional did your spending feel this week?',type:'slider',lo:'Mostly autopilot',hi:'Very intentional'},

 {id:'connect',n:'Connect',q:'Is there someone you’d like to talk about money with?',type:'choice',o:['My partner','A friend','Family','Someone in the Money 80 community','Not right now'],text:'A private note to yourself'}];

const ART=[
 {id:'ten',tag:'Mindset',m:3,t:'Why a $10 move counts',w:'You don’t build a habit with big numbers. You build it with reps.',b:`<p>A $10 transfer won’t change your net worth this month. It changes something more useful: the story you tell about yourself. Every time you follow through, you collect proof that you’re someone who acts on her plans.</p><p>Habit research keeps landing on the same idea: <b>consistency beats size</b>. Small, repeatable actions are easier to start, easier to repeat, and easier to grow later, when there’s more room.</p><ul><li>Pick an amount that feels almost too easy.</li><li>Tie it to something that already happens, like payday.</li><li>Raise it when it starts to feel automatic, not before.</li></ul>`},
 {id:'ef',tag:'Savings',m:4,t:'Emergency fund: how much is enough?',w:'A common guideline, plus how to make it yours.',b:`<p>A common guideline is <b>three to six months of essential expenses</b>: housing, utilities, groceries, insurance, transportation and minimum debt payments. It’s not three to six months of your whole paycheck, just the must-haves.</p><p>Your number depends on your life. If your income varies, you’re the only earner, or you have kids or a health situation to plan for, leaning toward six months (or more) makes sense. Two steady incomes might mean three is enough.</p><p>Starting is what matters most. Many people set a <b>starter goal</b> first, like one month of essentials or $1,000, then keep building. Keep the fund somewhere separate and easy to reach, like a high-yield savings account, so it’s there when you need it and out of sight when you don’t.</p>`},
 {id:'aval',tag:'Debt',m:4,t:'Avalanche or snowball?',w:'Two ways to pay down debt. Both work.',b:`<p><b>Avalanche:</b> pay the minimum on everything, then put any extra toward the debt with the highest interest rate. This usually saves the most money.</p><p><b>Snowball:</b> pay the minimum on everything, then put any extra toward the smallest balance. You knock out a whole debt sooner, and that win can keep you going.</p><p>The best method is the one you’ll stick with. Plenty of people mix them. Any amount above the minimum goes toward the principal, so every extra dollar shortens the road.</p>`},
 {id:'stmt',tag:'Debt',m:3,t:'Reading your credit card statement without dread',w:'Five numbers to find. That’s it.',b:`<p>Avoiding the statement is common, and the dread is usually worse than the numbers. Here’s what to look for:</p><ul><li><b>Statement balance:</b> what you owed when this billing cycle closed.</li><li><b>Minimum payment due:</b> the least you can pay to stay in good standing.</li><li><b>Due date:</b> pay by this date to avoid a late fee.</li><li><b>APR:</b> the yearly interest rate on any balance you carry.</li><li><b>Interest charged:</b> what carrying a balance cost you this month.</li></ul><p>On most cards, paying the full statement balance by the due date means you aren’t charged interest on new purchases. If that’s not possible yet, anything above the minimum helps.</p>`},
 {id:'tax',tag:'Variable income',m:5,t:'Setting money aside for taxes when you’re self-employed',w:'Nobody withholds for you, so the set-aside is yours to do.',b:`<p>When you’re self-employed, no employer takes taxes out. You owe <b>self-employment tax</b> (Social Security and Medicare, about 15.3% of net earnings, with the Social Security part capped each year) plus regular income tax.</p><p>That’s why many self-employed people set aside <b>25–30%</b> of what comes in, in a separate account, as each payment lands. Your right number depends on your income, deductions and state.</p><p>The IRS generally expects <b>quarterly estimated payments</b>, usually due in April, June, September and January. A tax professional can help you find your exact percentage. Money 80 is here to help you build the habit, not to give tax advice.</p>`},
 {id:'roth',tag:'Investing',m:4,t:'What’s a Roth IRA, really?',w:'A retirement account where the growth can come out tax-free.',b:`<p>A Roth IRA is an individual retirement account you fund with money you’ve already paid tax on. In exchange, <b>qualified withdrawals in retirement are tax-free</b>, including the growth.</p><p>You can generally take out what you <i>contributed</i> (not the earnings) at any time without penalty, which makes it feel less locked away for some people. There are yearly contribution limits and income limits, and the IRS updates them, so check the current numbers before you contribute.</p><p>A Roth IRA is the account, not the investment. Once money is in, you choose what it’s invested in. Many people start with a broad, low-cost index fund or a target-date fund.</p>`},
 {id:'cush',tag:'Basics',m:2,t:'A cushion in checking',w:'The small buffer that keeps one bad week from becoming a fee.',b:`<p>A checking cushion is a small amount you plan to leave in checking, even after bills and goal moves. It absorbs timing surprises: a bill that posts early, a payday that lands late.</p><p>It’s different from an emergency fund. The cushion handles day-to-day wobble. The emergency fund handles real emergencies. Even $100 can help you avoid overdraft fees.</p>`},
 {id:'feel',tag:'Mindset',m:3,t:'Money feelings are information',w:'Uncertain or overwhelmed isn’t failure. It’s a signal.',b:`<p>The feelings you name in your check-in aren’t grades. They’re information. Overwhelm often means too many open loops. Uncertainty often means a missing number. Pride usually means you kept a promise to yourself.</p><p>When a feeling repeats, ask: what’s one small thing that would make this 10% lighter? Then do only that.</p>`}];

 {id:'p1',sp:'wins',a:'Danielle R.',t:ago(.2),x:'I made my first transfer to my emergency fund. It was small and I almost talked myself out of it. I did it anyway.',r:{cheer:14,proud:9,metoo:3},c:[{a:'Keisha',x:'The almost-didn’t is the whole thing. So glad you did.'}]},

 const g=gs[0],nm=g.name.replace(/^(Pay (off|down)|Start) (my |the )?/i,'');

 sharetide:()=>{draft={text:`My ${MONTH}: ${S.month.resets} payday resets and ${Object.values(S.month.moves).reduce((a,b)=>a+b,0)} moves I actually made. Small moves, rising tide.`,sp:'wins',as:'name'};S.space='wins';go('community');setTimeout(()=>$('#ct')?.focus(),60)},
 introok:()=>{S.introSeen=true;render()},
 startreset:()=>{if(!S.reset||S.reset.step===5)S.reset=newReset();go('reset')},
 rtype:t=>{const r=R();r.type=t.dataset.v;S.incomeType=r.type;r.taxPct=r.type==='self'?25:0;render()},
 lastinc:()=>{R().income=String(S.lastIncome);render()},
 adddep:()=>{R().deps.push({l:'',a:''});render()},rmdep:t=>{R().deps.splice(+t.dataset.v,1);if(!R().deps.length)R().deps.push({l:'',a:''});render()},
 addbill:()=>{R().bills.push({l:'',a:'',on:true});render();$$('.bill .txt').pop()?.focus()},rmbill:t=>{R().bills.splice(+t.dataset.v,1);render()},
 rnext:()=>{const r=R();if(r.step===0&&rIncome(r)<=0){toast('Add what came in first. A rough number is fine.');return}r.step++;render(true)},
 rback:()=>{R().step--;render(true)},
 amt:t=>{const r=R();r.plan[t.dataset.g]=String(t.dataset.v);const i=$(`[data-bind="reset.plan.${t.dataset.g}"]`);if(i)i.value=t.dataset.v;refresh()},
 planmoves:()=>{const r=R();r.moves=S.goals.filter(g=>num(r.plan[g.id])>0).map(g=>({g:g.id,a:num(r.plan[g.id]),s:'planned',label:g.kind==='debt'?`Pay an extra ${money(num(r.plan[g.id]))} toward ${g.name.replace(/^Pay (off|down) /i,'')}`:`Move ${money(num(r.plan[g.id]))} to ${g.name}`}));
  if(!r.moves.length){toast('Pick an amount, even $10, or choose “No moves this time.”');return}r.step=4;render(true)},
 skipmoves:()=>{const r=R();r.moves=[];A.finish()},
 mv:t=>{const r=R(),m=r.moves[+t.dataset.i],v=t.dataset.v;m.s=m.s===v?'planned':v;render();if(m.s==='done'){fly($$('.move')[+t.dataset.i].querySelector('.btn.t'),6)}},
 finish:()=>{const r=R(),done=r.moves.filter(m=>m.s==='done'),later=r.moves.filter(m=>m.s==='later'),miles=[],ml=[],layers=[];
  done.forEach(m=>{const g=goalById(m.g);if(!g)return;S.month.moves[g.layer]=(S.month.moves[g.layer]||0)+1;const hits=setBalance(g,g.kind==='debt'?g.balance-m.a:g.balance+m.a);if(!layers.includes(g.layer))layers.push(g.layer);hits.forEach(h=>{miles.push(mileText(g,h));ml.push(g.layer);S.log.unshift({d:new Date().toISOString(),k:'mile',t:mileText(g,h)})})});
  later.forEach(m=>S.later.push({g:m.g,a:m.a,label:m.label}));
  if(r.moves.length||done.length)S.log.unshift({d:new Date().toISOString(),k:'move',t:r.moves.length?`Payday Reset: made ${done.length===r.moves.length?'all '+done.length:done.length+' of '+r.moves.length} moves you planned`:'Payday Reset: reviewed your money on purpose'});
  else S.log.unshift({d:new Date().toISOString(),k:'move',t:'Payday Reset: reviewed your money on purpose'});
  S.stats.resets++;S.month.resets++;S.stats.moves+=done.length;if(r.type==='w2'&&num(r.income))S.lastIncome=num(r.income);
  S.resetDone=true;r.result={done:done.length,total:r.moves.length,later:later.length,miles,ml,layers};r.step=5;render(true)},
 seeflow:()=>{const x=R().result;pendingFx={miles:x.ml,msg:x.miles.length?'Milestone: '+x.miles[0]+'.':x.done?(x.layers.includes('cushion')?'You made room for your future today.':x.layers.includes('debt')?'You took a little weight off today.':'You planted something today.'):null};go('practice')},
 sharewin:()=>{draft={text:R().result.done===R().result.total?'I finished my Payday Reset and made every move I planned.':'I finished my Payday Reset and followed through on my moves.',sp:'wins',as:'name'};S.space='wins';go('community');setTimeout(()=>$('#ct')?.focus(),60)},
 laterdone:t=>{const m=S.later.splice(+t.dataset.v,1)[0];const g=goalById(m.g);if(g){const hits=setBalance(g,g.kind==='debt'?g.balance-m.a:g.balance+m.a);S.stats.moves++;S.month.moves[g.layer]=(S.month.moves[g.layer]||0)+1;S.log.unshift({d:new Date().toISOString(),k:'move',t:'Made a move you’d saved for later'});hits.forEach(h=>S.log.unshift({d:new Date().toISOString(),k:'mile',t:mileText(g,h)}));pendingFx={miles:hits.length?[g.layer]:[],msg:'Followed through. That one counts.'}}render()},
 laterdrop:t=>{S.later.splice(+t.dataset.v,1);toast('Let go. Plans change, and that’s fine.');render()},
 cimode:t=>{S.ci=newCI(t.dataset.v);go('checkin')},
 cistart:()=>{S.ci=null;render(true)},
 conf:t=>{S.ci.conf=+t.dataset.v;render()},feel:t=>{S.ci.feel=t.dataset.v;render()},
 cinext:()=>{const c=S.ci;c.step=c.step===1?(c.mode==='moment'?2:3):3;render(true)},
 ciback:()=>{const c=S.ci;c.step=c.step===3?(c.mode==='moment'?2:1):1;render(true)},
 thpre:t=>{S.themeIdx=+t.dataset.v;const T=THEMES[S.themeIdx];S.ci.ans=T.type==='checks'?[]:T.type==='slider'?3:'';S.ci.text='';render()},
 thchoice:t=>{S.ci.ans=t.dataset.v;render()},
 thcheck:t=>{const a=S.ci.ans,i=+t.dataset.v;t.checked?a.push(i):a.splice(a.indexOf(i),1)},
 cisup:t=>{S.ci.support=t.dataset.v;render()},
 cifinish:()=>{const c=S.ci;S.support=c.support;S.checkins.push({d:new Date().toISOString(),conf:c.conf,feel:c.feel,mode:c.mode,theme:c.mode==='moment'?THEMES[S.themeIdx].id:null});S.log.unshift({d:new Date().toISOString(),k:'checkin',t:`Weekly check-in: you felt ${c.feel}`});S.checkinDone=true;c.step=4;render(true)},
 upd:t=>updModal(goalById(t.dataset.v)),
 updwhy:t=>{$$('[data-act=updwhy]').forEach(b=>b.setAttribute('aria-pressed',b===t));modalState.why=t.dataset.v},
 updsave:()=>{const m=modalState,g=goalById(m.g),nb=num(m.val);const before=pct(g),bh=g.high;const hits=setBalance(g,nb);closeModal();
  const after=pct(g);if(m.why)S.log.unshift({d:new Date().toISOString(),k:'move',t:`Updated ${g.name}${m.why?' ('+m.why.toLowerCase()+')':''}`});
  pendingFx={miles:hits.length?[g.layer]:[],msg:after<before?(bh>after?'Setbacks happen. Your high-water mark stays.':'Updated. Your Flow is current.'):hits.length?mileText(g,hits[hits.length-1])+'.':'Updated. Your Flow is current.'};render()},
 rethink:t=>rtModal(goalById(t.dataset.v)),addgoal:t=>rtModal(null,t.dataset.v),
 rtlayer:t=>{modalState.g.layer=t.dataset.v;modalState.g.kind=t.dataset.v==='debt'?'debt':'save';drawRt()},
 rtwhy:t=>{modalState.g.why=t.dataset.v;drawRt()},rtstrat:t=>{modalState.g.strategy=t.dataset.v;drawRt()},
 rtnext:()=>{const g=modalState.g;if(modalState.step===1&&!g.name.trim()){toast('Give it a name, any name.');return}modalState.step++;drawRt()},rtback:()=>{modalState.step--;drawRt()},
 rtsave:()=>{const m=modalState,n=m.g;['start','balance','target'].forEach(k=>n[k]=num(n[k]));
  if(m.n){if(n.kind==='debt'&&!n.start)n.start=n.balance;n.id='g'+Date.now();S.goals.push(goal({...n,marks:[],prev:n.balance}));toast('Goal added. It has its own tide now.')}
  else{const g=goalById(n.id);Object.assign(g,{name:n.name,why:n.why,by:n.by,strategy:n.strategy,start:n.start,target:n.target});setBalance(g,n.balance);g.high=Math.max(pct(g),g.high);toast('Goal updated. Your milestones are still yours.')}
  closeModal();render()},
 close:()=>closeModal(),
 space:t=>{S.space=t.dataset.v;render()},
 postas:t=>{draft.as=t.dataset.v;render()},
 strip:()=>{draft.text=draft.text.replace(/\$\s?[\d,]+(\.\d+)?(\s?k\b)?/gi,'some money').replace(/\b[\d,]{3,}(\.\d+)?\s?(dollars|bucks)?/gi,'a lot').replace(/\b\d+\s?(k|dollars|bucks)\b/gi,'some money');render();$('#ct')?.focus()},
 post:t=>{const x=draft.text.trim();if(!x)return;if(MONEY_RE.test(x)){toast('Take the numbers out first. Your story is the good part.');return}
  const p={id:'m'+Date.now(),sp:S.space,a:draft.as==='init'?(S.name[0]+'.'):S.name,t:new Date().toISOString(),x,r:{},c:[]};S.posts.unshift(p);S.mine[p.id]=1;draft={text:'',sp:S.space,as:draft.as};
  S.log.unshift({d:p.t,k:'checkin',t:`Shared in ${SPACES.find(s=>s.id===p.sp).n}`});render();fly($('#'+p.id+' .tx'),12);toast('Posted. Thank you for sharing.')
  setTimeout(()=>{p.r.cheer=(p.r.cheer||0)+3;p.r.proud=(p.r.proud||0)+1;p.r.thanks=(p.r.thanks||0)+(p.sp==='table'?2:0);if(view==='community')render()},2600)},
 react:t=>{const p=S.posts.find(x=>x.id===t.dataset.p),k=t.dataset.v;p.my=p.my||{};p.my[k]=!p.my[k];p.r[k]=(p.r[k]||0)+(p.my[k]?1:-1);if(p.my[k])fly(t,8);t.setAttribute('aria-pressed',p.my[k]);t.textContent=t.textContent.replace(/\d+$/,p.r[k]);save()},
 cmt:t=>{const p=S.posts.find(x=>x.id===t.dataset.v);p.open=!p.open;render();p.open&&$('#cm-'+p.id)?.focus()},
 cmtsend:t=>{const p=S.posts.find(x=>x.id===t.dataset.v),i=$('#cm-'+p.id),x=i.value.trim();if(!x)return;if(MONEY_RE.test(x)){toast('Keep replies money-agnostic: share the how, not the how much.');return}p.c.push({a:S.name,x});render();$('#cm-'+p.id)?.focus()},
 lf:t=>{S.lfilter=t.dataset.v;render()},
 read:t=>{const a=ART.find(x=>x.id===t.dataset.v);if(!S.log.some(l=>l.t===`Read “${a.t}”`))S.log.unshift({d:new Date().toISOString(),k:'learn',t:`Read “${a.t}”`});save();
  openModal(`<div class="reader"><span class="small" style="color:var(--fuchink);font-weight:700">${a.tag} · ${a.m} min read</span><h2>${a.t}</h2>${a.b}<p class="small muted">Educational, not financial, tax or legal advice.</p></div>`)},
 obpri:t=>{const a=S.ob.pri,v=t.dataset.v;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);render()},
 obgoal:t=>{const a=S.ob.goals,v=t.dataset.v;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);render()},
 obnext:()=>{S.ob.step++;render(true)},obback:()=>{S.ob.step--;render(true)},
 obdebt:t=>{S.ob.d.debt.type=t.dataset.v;render()},obpath:t=>{S.ob.d.emerg.path=t.dataset.v;render()},obsup:t=>{S.ob.support=t.dataset.v;render()},
 obfinish:()=>{finishOb();view='practice';history.replaceState(null,'','#practice');render(true)}};
document.addEventListener('click',e=>{if(!e.target.closest('.palw'))$('#palpop')?.classList.remove('open');const t=e.target.closest('[data-act]');if(!t)return;if(t.type==='checkbox'&&t.dataset.act==='hide'){A.hide(t);return}if(t.type==='checkbox'){A[t.dataset.act]?.(t,e);save();return}A[t.dataset.act]?.(t,e)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#palpop').classList.remove('open');$('#proto').classList.remove('open')}});

function setP(path,val){let o=S,k=path.split('.');if(k[0]==='$m'){o=modalState;k=k.slice(1)}for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
function refresh(){$$('[data-out]').forEach(el=>{const f=OUT[el.dataset.out];if(f)el.textContent=f()})}
function onInput(e){const t=e.target;
 if(t.dataset.draft){draft.text=t.value;const g=$('#guard'),f=MONEY_RE.test(t.value);g.innerHTML=f?`<div class="guard">Money 80 keeps celebrations money-agnostic, so nobody compares numbers. Try sharing the action instead of the amount. <button class="link" data-act="strip">Remove the numbers for me</button></div>`:'';$('[data-act=post]').disabled=!t.value.trim();return}
 const b=t.dataset.bind;if(!b)return;
 const v=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;setP(b,v);
 if(['calm','inform','support','showPct'].includes(b)||b.startsWith('remind')){if(b==='support')toast(`Got it: ${SUPPORT.find(s=>s.id===v).t.toLowerCase()} from here on.`);if(e.type==='change'){render()}}
 refresh();save()}
document.addEventListener('input',onInput);document.addEventListener('change',e=>{const b=e.target.dataset.bind;if(b&&(['calm','inform','support','showPct'].includes(b)||b.startsWith('remind')))onInput(e)});
document.addEventListener('focusout',e=>{const t=e.target;if(t.closest?.('.cur')&&t.value.trim()){const n=num(t.value);t.value=n.toLocaleString('en-US',{maximumFractionDigits:2})}});
render();
}
</script>
